<title>Stitch Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Title on top, row chip over a flip-clock stitch count, tactile keys beneath, mic status at the foot. */
:root {
  --bg: #E8E2D6;
  --ink: #1B1A17;
  --tile: #171614;
  --tile-text: #F3EFE6;
  --muted: #5E584C;
  --rec: #E5533D;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font-family: var(--mono); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-align: center;
  padding-left: 0.3em;
}
main {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
}

.row-chip {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--muted);
}
.row-chip b {
  background: var(--ink);
  color: var(--tile-text);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 4px 11px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
}

/* Flip clock */
.flip {
  --tw: clamp(52px, min(20vw, 16vh, 132px), 132px);
  --th: calc(var(--tw) * 1.38);
  display: flex;
  justify-content: center;
  gap: 8px;
}
.tile {
  position: relative;
  width: var(--tw);
  height: var(--th);
  perspective: 500px;
  font-size: calc(var(--th) * 0.66);
  font-weight: 800;
  color: var(--tile-text);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: calc(50% - 1px);
  height: 2px;
  background: rgba(243, 239, 230, 0.14);
  z-index: 5;
}
.half, .flap {
  position: absolute;
  left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  background: var(--tile);
}
.top, .front { top: 0; border-radius: 8px 8px 0 0; }
.bottom, .back { bottom: 0; border-radius: 0 0 8px 8px; }
.half span, .flap span {
  position: absolute;
  left: 0; right: 0;
  height: var(--th);
  line-height: var(--th);
  text-align: center;
}
.top span, .front span { top: 0; }
.bottom span, .back span { top: calc(var(--th) * -0.5); }
.flap { visibility: hidden; backface-visibility: hidden; }
.front { transform-origin: bottom; z-index: 3; }
.back { transform-origin: top; transform: rotateX(90deg); z-index: 2; }
.tile.flip .flap { visibility: visible; }
.tile.flip .front { animation: fold-down 0.2s ease-in both; }
.tile.flip .back { animation: fold-up 0.2s ease-out 0.2s both; }
@keyframes fold-down { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
@keyframes fold-up { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }

/* Tactile keys */
.keys {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-bottom: 6px;
}
.key {
  height: 60px;
  border: 0;
  border-radius: 12px;
  background: var(--tile);
  color: var(--tile-text);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 5px 0 #000, 0 9px 16px rgba(0, 0, 0, 0.18);
  transition: transform 0.06s, box-shadow 0.06s;
}
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 #000, 0 3px 6px rgba(0, 0, 0, 0.18); }
.pm { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.key.big { height: 84px; font-size: 38px; font-weight: 600; letter-spacing: 0; line-height: 1; }
.key.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
.key.alt:active { box-shadow: 0 1px 0 var(--ink); }

/* Foot: voice status */
.foot {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.mic {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  cursor: pointer;
  touch-action: manipulation;
}
.mic .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.mic[data-state="on"] { background: var(--ink); color: var(--tile-text); }
.mic[data-state="on"] .dot { background: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.hint { margin: 0; min-height: 3em; max-width: 36ch; font-size: 12px; line-height: 1.5; color: var(--muted); }
.heard { min-height: 1.4em; max-width: 100%; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reset { border: 0; background: none; padding: 6px 10px; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.links { display: flex; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 640px) {
  main { gap: 16px; }
  .key { height: 52px; }
  .key.big { height: 68px; }
  .hint { min-height: 2.6em; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.flip .front, .tile.flip .back, .mic .dot { animation: none !important; }
  .key { transition: none; }
}
</style>

<div class="app">
  <header><h1>STITCH COUNTER</h1></header>

  <main>
    <div class="row-chip" aria-hidden="true">ROW <b id="row">01</b></div>
    <div class="flip" id="flip" aria-hidden="true"></div>
    <div class="sr" role="status" aria-live="polite" id="sr"></div>

    <div class="keys">
      <div class="pm">
        <button class="key big alt" id="minus" type="button" aria-label="Remove one stitch">&minus;</button>
        <button class="key big" id="add" type="button" aria-label="Add one stitch">+</button>
      </div>
      <button class="key" id="next" type="button">Next row</button>
      <button class="key alt" id="restart" type="button">Restart row</button>
    </div>
  </main>

  <div class="foot">
    <button class="mic" id="mic" type="button" data-state="off"><span class="dot"></span><span id="micLabel">START LISTENING</span></button>
    <p class="hint" id="hint">Tap to turn on voice. Then say “add one” or “next row”.</p>
    <div class="heard" id="heard"></div>
    <div class="links">
      <button class="reset" id="undo" type="button">UNDO</button>
      <button class="reset" id="reset" type="button">RESET ALL</button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = 'stitch-counter-v1';
  var state = { stitches: 0, row: 1, hist: [] };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Number.isInteger(saved.stitches) && Number.isInteger(saved.row)) {
      state.stitches = Math.max(0, saved.stitches);
      state.row = Math.max(1, saved.row);
      state.hist = Array.isArray(saved.hist) ? saved.hist.slice(-200) : [];
    }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var flipEl = document.getElementById('flip');
  var rowEl = document.getElementById('row');
  var srEl = document.getElementById('sr');

  /* ---------- flip tiles ---------- */
  function makeTile(d) {
    var t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML = '<div class="half top"><span></span></div><div class="half bottom"><span></span></div>' +
                  '<div class="flap front"><span></span></div><div class="flap back"><span></span></div>';
    var sp = t.querySelectorAll('span');
    sp[0].textContent = d; sp[1].textContent = d;
    t._d = d; t._timer = null;
    return t;
  }
  function setTile(t, d) {
    if (t._d === d) return;
    var sp = t.querySelectorAll('span');
    var top = sp[0], bottom = sp[1], front = sp[2], back = sp[3];
    var old = t._d;
    t._d = d;
    if (reduce) { top.textContent = d; bottom.textContent = d; return; }
    if (t._timer) { clearTimeout(t._timer); bottom.textContent = old; }
    t.classList.remove('flip');
    void t.offsetWidth;
    top.textContent = d;
    front.textContent = old;
    back.textContent = d;
    t.classList.add('flip');
    t._timer = setTimeout(function () {
      bottom.textContent = d;
      t.classList.remove('flip');
      t._timer = null;
    }, 440);
  }
  function digits(n) { return String(n).padStart(3, '0'); }
  (function init() {
    digits(state.stitches).split('').forEach(function (ch) { flipEl.appendChild(makeTile(ch)); });
  })();
  function renderCount(n) {
    var s = digits(n);
    while (flipEl.children.length < s.length) flipEl.insertBefore(makeTile('0'), flipEl.firstChild);
    while (flipEl.children.length > s.length) flipEl.removeChild(flipEl.firstChild);
    Array.prototype.forEach.call(flipEl.children, function (t, i) { setTile(t, s[i]); });
  }
  function render() {
    renderCount(state.stitches);
    rowEl.textContent = String(state.row).padStart(2, '0');
    srEl.textContent = 'Row ' + state.row + ', stitch ' + state.stitches;
    save();
  }
  render();

  /* ---------- actions ---------- */
  function trim() { if (state.hist.length > 200) state.hist = state.hist.slice(-200); }
  function addStitch() { state.stitches++; state.hist.push({ t: 's' }); trim(); render(); }
  function removeStitch() {
    if (state.stitches <= 0) return;
    state.stitches--; state.hist.push({ t: 'm' }); trim(); render();
  }
  function nextRow() { state.hist.push({ t: 'r', prev: state.stitches }); trim(); state.row++; state.stitches = 0; render(); }
  function restartRow() {
    if (state.stitches <= 0) return;
    state.hist.push({ t: 'x', prev: state.stitches }); trim(); state.stitches = 0; render();
  }
  function undo() {
    var a = state.hist.pop();
    if (!a) return;
    if (a.t === 's') state.stitches = Math.max(0, state.stitches - 1);
    else if (a.t === 'm') state.stitches++;
    else if (a.t === 'x') state.stitches = a.prev || 0;
    else { state.row = Math.max(1, state.row - 1); state.stitches = a.prev || 0; }
    render();
  }
  document.getElementById('add').addEventListener('click', addStitch);
  document.getElementById('minus').addEventListener('click', removeStitch);
  document.getElementById('next').addEventListener('click', nextRow);
  document.getElementById('restart').addEventListener('click', restartRow);
  document.getElementById('undo').addEventListener('click', undo);

  var resetBtn = document.getElementById('reset');
  var resetTimer = null;
  function disarm() { clearTimeout(resetTimer); resetBtn.dataset.armed = ''; resetBtn.textContent = 'RESET'; }
  resetBtn.addEventListener('click', function () {
    if (resetBtn.dataset.armed) {
      disarm();
      state = { stitches: 0, row: 1, hist: [] };
      render();
    } else {
      resetBtn.dataset.armed = '1';
      resetBtn.textContent = 'TAP AGAIN TO RESET';
      resetTimer = setTimeout(disarm, 3000);
    }
  });

  /* ---------- voice ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById('mic');
  var micLabel = document.getElementById('micLabel');
  var hintEl = document.getElementById('hint');
  var heardEl = document.getElementById('heard');
  var want = false, rec = null, handled = {}, hadError = false, wake = null;

  var HINTS = {
    off: 'Tap to turn on voice. Then say “add one” or “next row”.',
    on: 'Say “add one”, “minus one”, “next row” or “restart row”.',
    blocked: 'This page can’t use the microphone right now. The buttons still work.',
    unsupported: 'Voice isn’t supported in this browser. Try Chrome or Safari. The buttons still work.',
    network: 'Voice needs an internet connection. Trying again.'
  };
  function setVoice(mode) {
    micBtn.dataset.state = mode === 'on' || mode === 'network' ? 'on' : 'off';
    micLabel.textContent = micBtn.dataset.state === 'on' ? 'LISTENING' : 'START LISTENING';
    hintEl.textContent = HINTS[mode];
    if (mode !== 'on') heardEl.textContent = '';
  }

  var CMD = /\b(restart the row|restart row|restarting|restart|start the row over|start the row again|start row over|start over|starting over|start again|redo the row|redo this row|redo row|reset the row|reset row|clear the row|clear row|add a stitch|add one stitch|add one|add 1|ad one|plus one|plus 1|one more|add|minus one|minus 1|remove one|take one off|take one|subtract one|one less|less one|next row|new row|next|undo|go back)\b/g;
  function parse(text) {
    var clean = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ');
    var out = [], m;
    CMD.lastIndex = 0;
    while ((m = CMD.exec(clean))) {
      var w = m[1];
      if (/start|redo|reset|clear/.test(w)) out.push('restart');
      else if (/minus|remove|take|subtract|less/.test(w)) out.push('minus');
      else if (/undo|back/.test(w)) out.push('undo');
      else if (/row|^next$/.test(w)) out.push('row');
      else out.push('stitch');
    }
    return out;
  }
  function run(c) {
    if (c === 'stitch') addStitch();
    else if (c === 'minus') removeStitch();
    else if (c === 'restart') restartRow();
    else if (c === 'row') nextRow();
    else if (c === 'undo') undo();
  }

  function lockScreen() {
    try {
      if ('wakeLock' in navigator && !wake) {
        navigator.wakeLock.request('screen').then(function (l) {
          wake = l;
          l.addEventListener('release', function () { wake = null; });
        }, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (want && document.visibilityState === 'visible') lockScreen();
  });

  function startRec() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    handled = {};
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var text = e.results[i][0].transcript;
        heardEl.textContent = 'heard: ' + text.trim();
        if (!e.results[i].isFinal || handled[i]) continue;
        handled[i] = 1;
        parse(text).forEach(run);
      }
    };
    rec.onerror = function (e) {
      hadError = true;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        want = false;
        setVoice('blocked');
      } else if (e.error === 'network') {
        setVoice('network');
      }
    };
    rec.onend = function () {
      if (!want) return;
      var delay = hadError ? 1500 : 200;
      hadError = false;
      setTimeout(function () {
        if (!want) return;
        try { startRec(); } catch (err) { want = false; setVoice('blocked'); }
      }, delay);
    };
    rec.start();
  }
  function stopVoice() {
    want = false;
    try { if (rec) { rec.onend = null; rec.stop(); } } catch (e) {}
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    setVoice('off');
  }
  micBtn.addEventListener('click', function () {
    if (want) { stopVoice(); return; }
    if (!SR) { setVoice('unsupported'); return; }
    want = true;
    setVoice('on');
    lockScreen();
    try { startRec(); } catch (e) { want = false; setVoice('blocked'); }
  });
  if (!SR) setVoice('unsupported');
})();
</script>
